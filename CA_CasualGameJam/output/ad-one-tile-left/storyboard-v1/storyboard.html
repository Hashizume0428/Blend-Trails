<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE TILE LEFT | 36秒 絵コンテ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf7fd;color:#101f54;font-family:system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 24px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}figure{margin:0;background:white;padding:12px;border-radius:16px;box-shadow:0 6px 24px #10205012}figure img{display:block;width:100%;height:auto;border-radius:10px}figcaption{padding:12px 4px 2px;font-weight:700;font-size:15px}small{display:block;margin-top:5px;font-weight:400;line-height:1.6}a{color:inherit;text-decoration:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:16px}.grid{grid-template-columns:1fr}}</style>
<main><h1>ONE TILE LEFT — あと1マスなのに</h1><p>36秒・縦長9:16・5列×4行。各画像を押すとPNGを開きます。白い手・指先の接触リング・短い軌跡でスワイプを示します。後半の白マスは左下に統一。</p><div class="grid">
<figure><a href="01-so-satisfying.png"><img src="01-so-satisfying.png" alt="01 SO SATISFYING!"></a><figcaption>01 / 0–3秒 — SO SATISFYING!<small>赤のスワイプ開始。指先の光と左向きの矢印で移動を示す。</small></figcaption></figure>
<figure><a href="02-trace-mix-fill.png"><img src="02-trace-mix-fill.png" alt="02 TRACE. MIX. FILL."></a><figcaption>02 / 3–12秒 — TRACE. MIX. FILL.<small>青を重ねて指定マスを紫に混色。上向きのスワイプを示す。</small></figcaption></figure>
<figure><a href="03-perfect.png"><img src="03-perfect.png" alt="03 PERFECT!"></a><figcaption>03 / 12–16秒 — PERFECT!<small>20マスすべて正解。盤面の弾み、光、紙吹雪。</small></figcaption></figure>
<figure><a href="04-one-tile-left.png"><img src="04-one-tile-left.png" alt="04 ONE TILE LEFT..."></a><figcaption>04 / 16–26秒 — ONE TILE LEFT...<small>左下の白マスだけが残り、その1つ上で指が止まる。</small></figcaption></figure>
<figure><a href="05-not-again.png"><img src="05-not-again.png" alt="05 NOT AGAIN!"></a><figcaption>05 / 26–33秒 — NOT AGAIN!<small>青だけリセットして引き直すが、同じ左下を塗り忘れる。</small></figcaption></figure>
<figure><a href="06-can-you-finish-it.png"><img src="06-can-you-finish-it.png" alt="06 CAN YOU FINISH IT? / PLAY NOW"></a><figcaption>06 / 33–36秒 — CAN YOU FINISH IT? / PLAY NOW<small>白マスと盤面を残したまま、ロゴ・問いかけ・PLAY NOW。</small></figcaption></figure>
</div></main></html>
