<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blend Trails — タイトル演出 実装確認</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071631;color:#fff6d8;font:15px/1.8 system-ui,"Yu Gothic UI",sans-serif}main{max-width:1120px;margin:auto;padding:30px}.tag{color:#8bdcff;letter-spacing:.1em;font-size:12px}h1{font-size:clamp(25px,4vw,36px);margin:6px 0 10px}p{color:#b8cee9;margin:0 0 22px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{padding:14px;background:#102541;border:1px solid #284461;border-radius:18px}h2{margin:0 0 12px;font-size:18px}.movie{display:flex;justify-content:center}video{display:block;max-width:100%;max-height:67vh;aspect-ratio:9/16;border-radius:10px;background:#2db5f3}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 28px}button,a{font:inherit;color:#8bdcff}button{color:#fff6d8;background:#18456b;border:1px solid #3a759b;border-radius:9px;padding:8px 14px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #8bdcff;outline-offset:3px}.meta{font-size:12px;color:#9eb9d4;margin-top:10px}.screens{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;border-radius:10px}.wide{margin-top:26px;width:100%}section{margin-top:28px}@media(max-width:650px){main{padding:22px 14px}.compare{gap:12px}article{padding:8px}h2{font-size:15px}video{max-height:none}.screens{gap:12px}}</style></head>
<body><main><div class="tag">BLEND TRAILS: COLOR PUZZLE</div><h1>タイトル画面 アニメーション実装</h1><p>ロゴの登場、混色ラインの光、開始ボタンのバウンス、ゆったりした待機ループをUnityへ実装しました。</p>
<p><a href="../ui-title-logo-fix/index.html">ロゴの登場を修正した最新版を見る</a></p>
<div class="compare"><article><h2>Unityの実画面（初版）</h2><div class="movie"><video id="native" controls loop muted playsinline preload="auto" poster="native-result.png" src="blend-trails-title-native.mp4"></video></div><div class="meta">12秒 / 720×1280 / 30fps書き出し / 音声なし</div></article><article><h2>採用した動画案</h2><div class="movie"><video id="proposal" controls loop muted playsinline preload="auto" src="../ui-title-motion/blend-trails-title-proposal.mp4"></video></div><div class="meta">既存素材から制作した実装前のイメージ動画</div></article></div>
<div class="controls"><button id="replay">両方を最初から再生</button><button id="speed">0.5倍速で見る</button><a href="blend-trails-title-native.mp4" download>実画面のMP4を保存</a><a href="validation-summary.json">検証結果</a></div>
<p>開始ボタンは約2.6秒で操作可能になります。保存されたステージ番号を表示し、そのステージへ進みます。</p>
<section><h2>画面比率の確認</h2><div class="screens"><article><h2>縦長の画面</h2><a href="native-tall.png"><img src="native-tall.png" alt="縦長比率でのタイトル表示"></a></article><article><h2>タブレットの比率</h2><a href="native-tablet.png"><img src="native-tablet.png" alt="タブレット比率でのタイトル表示"></a></article></div></section>
<section><h2>実画面のコマ送り</h2><a href="native-storyboard.png"><img class="wide" src="native-storyboard.png" alt="タイトル演出の8場面"></a></section>
</main><script>const videos=[document.getElementById('native'),document.getElementById('proposal')];document.getElementById('replay').onclick=()=>videos.forEach(v=>{v.currentTime=0;v.play()});document.getElementById('speed').onclick=e=>{const rate=videos[0].playbackRate===1?.5:1;videos.forEach(v=>v.playbackRate=rate);e.target.textContent=rate===1?'0.5倍速で見る':'通常速度に戻す'};</script></body></html>
